# copilot.yaml
guidelines:
  - Use React Query for all API calls.
  - Hooks must handle error messages with react-hot-toast.
  - Services should only communicate with the API and not display messages.
  - Use the structure { resource, error, status } for API responses.
  - Prefer async functions and await.
  - Use styled-components for styles in UI components.
  - Organize code by features in the src/features folder.
  - Use Yup for form validations in the src/validations folder.
  - Centralize global constants in src/utils/constants.js.
  - Custom hooks should encapsulate business logic and be reusable.
  - Organize code by features in the src/features folder.
  - All success or error messages shown to the user must be in Brazilian Portuguese.
  - The frontend will only display results; all calculations, filters, and general logic must come from the API.
patterns:
  - Hooks must start with "use".
  - Service files must start with "api".
  - UI components must be in the "ui" folder.
  - Validation files must end with Validation.js or Validations.js.
  - Constant files must be in the "utils" folder and called constants.js.
  - Each feature's files must be in src/features/[featureName].
  - Context files must be in src/context and end with Context.jsx.
